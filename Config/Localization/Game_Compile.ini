; Цель локализации «Game»: компиляция .locres из переведённых архивов.
;
; Запуск без редактора:
;   UnrealEditor-Cmd.exe <проект>.uproject -run=GatherText -config="Config/Localization/Game_Compile.ini"
; Результат — Content/Localization/Game/<культура>/Game.locres. Именно его читает
; игра при смене языка (см. UTacticsUserSettings::ApplyPendingLanguage).

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
ResourceName=Game.locres
bSkipSourceCheck=false
bValidateFormatPatterns=true
bValidateSafeWhitespace=false
bValidateRichTextTags=false
NativeCulture=ru
CulturesToGenerate=ru
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GenerateTextLocalizationResource
