; Цель локализации «Game»: сбор текста игры.
;
; Обычно эти файлы генерирует Localization Dashboard редактора. Здесь они
; написаны руками и НАМЕРЕННО не содержат абсолютных путей: проект собирается на
; двух машинах с разными путями к движку (CLAUDE.md), а сгенерированный вариант
; вписывает сюда путь к Engine.manifest конкретной машины и ломает вторую.
;
; Запуск без редактора (пути движка и проекта подставить свои):
;   UnrealEditor-Cmd.exe <проект>.uproject -run=GatherText -config="Config/Localization/Game_Gather.ini"
; Либо из редактора: Project Settings → Localization Dashboard → цель Game → Gather.
;
; Родная культура — ru: исходные строки в коде и ассетах написаны по-русски.
; Английский появляется переводом Content/Localization/Game/en/Game.archive.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=ru
CulturesToGenerate=ru
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source
SearchDirectoryPaths=%LOCPROJECTROOT%Config
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Content/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=Game_Conflicts.txt
