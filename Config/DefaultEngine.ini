[/Script/Engine.CollisionProfile]
; Сценарные триггеры (ATacticalQuestZone) не должны участвовать в cover/LOS-трейсах.
; Эти трейсы идут LineTraceByObjectType по WorldStatic/WorldDynamic, а стандартный
; профиль Trigger имеет ObjectType = WorldDynamic — из-за этого бокс зоны давал
; бойцам полное укрытие и перекрывал линию огня. Собственный object channel
; выводит зоны из этих запросов, оставляя overlap с пешками.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Overlap,bTraceType=False,bStaticObject=False,Name="ScenarioTrigger")
; DefaultResponse=Overlap обязателен: без него остальные каналы получают Block,
; а рекаст считает препятствием всё, что блокирует Pawn/Vehicle — зона вырезала
; бы дыру в навмеше прямо там, куда шаг просит прийти.
+Profiles=(Name="ScenarioTrigger",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="ScenarioTrigger",DefaultResponse=ECR_Overlap,CustomResponses=((Channel="Visibility",Response=ECR_Ignore)),HelpMessage="Триггер сценария: overlap с пешками, невидим для cover/LOS-трейсов и навигации")

