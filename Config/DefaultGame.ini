[/Script/Engine.AssetManagerSettings]
; Quest Definition обязан попасть в реестр AssetManager, иначе MakeQuestAvailable
; молча ничего не делает и сценарий падает с «нельзя запустить из состояния 0».
; Сканируется единственный корень дизайнерских Data Assets — /Game/XRU1Game/Data
; (рекурсивно, поэтому DA_Quest_* лежат в его подпапке Missions/). Держать
; DA_Quest_* вне этого дерева нельзя — см. docs/05_WORKFLOW.md §3.
+PrimaryAssetTypesToScan=(PrimaryAssetType="Quest",AssetBaseClass="/Script/STQuestSystem.QuestDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/XRU1Game/Data")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

